<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Coin Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f7f8fc;min-height:100vh}
#app{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:700;color:#1a1a2e;margin:4px 0}
.hdr{text-align:center;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:10px 0;border:none;border-radius:10px;background:#e5e7eb;color:#555;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.tab.on{background:#4f46e5;color:#fff}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ctitle{font-weight:600;font-size:14px;color:#374151;margin-bottom:12px}
.li{display:flex;align-items:center;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:2px solid transparent}
.li.top{box-shadow:0 2px 12px rgba(79,70,229,.15);border-color:#c7d2fe}
.rank{font-size:22px;width:36px;text-align:center}
.lname{flex:1;margin-left:10px;font-weight:600;font-size:15px;color:#1a1a2e}
.lcoins{font-weight:700;font-size:18px;color:#4f46e5}
.ai{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.arow{display:flex;justify-content:space-between;align-items:center}
.aname{font-weight:600;color:#1a1a2e}
.aamt{font-weight:700;font-size:15px}
.pos{color:#4f46e5}.neg{color:#ef4444}
.ars{color:#555;font-size:13px;margin-top:4px}
.ats{color:#aaa;font-size:11px;margin-top:4px}
input,select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #d1d5db;font-size:14px;outline:none;font-family:inherit}
.row{display:flex;gap:8px;margin-top:8px}
.btn{width:100%;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
.btn.red{background:#ef4444}
.btn.gray{background:#6b7280}
.btn.out{background:none;border:1px solid #d1d5db;color:#555}
.btn.sm{width:auto;padding:4px 12px;font-size:12px}
.btn.ico{background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:0}
.mr{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}
.mn{flex:1;font-size:14px;color:#1a1a2e}
.mc{color:#4f46e5;font-weight:600;font-size:13px;margin-right:12px}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
.spin{text-align:center;padding:40px 0;color:#aaa;font-size:13px}
.sav{text-align:center;color:#888;font-size:12px;margin-top:8px;display:none}
.errt{color:#ef4444;font-size:12px;margin-bottom:8px;display:none}
.desc{color:#555;font-size:13px;margin-bottom:8px}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt16{margin-top:16px}
.ahdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.crow{display:flex;gap:8px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="toast"></div>
  <div class="hdr">
    <div style="font-size:36px">&#x1FA99;</div>
    <h1>Team Coin Tracker</h1>
    <p style="color:#888;font-size:13px">Recognize great work with coins</p>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('lb')">&#x1F3C6; Leaderboard</button>
    <button class="tab" onclick="switchTab('ac')">&#x1F4CB; Activity</button>
    <button class="tab" onclick="switchTab('ad')">&#x2699;&#xFE0F; Admin</button>
  </div>
  <div id="lb"></div>
  <div id="ac" style="display:none"></div>
  <div id="ad" style="display:none"></div>
</div>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweAMtdIfBqEmRgRdAs0fCPxIfWvjA7_qahXh5FwZ0jxqxshzS-gOHIq7iRAK4IoG6KJw/exec";
var PASS = "summer2026";
var members = [];
var activity = [];
var isAdmin = false;
var working = false;
var curTab = "lb";

function api(params) {
  return new Promise(function(resolve, reject) {
    var cb = "cb" + Date.now() + Math.floor(Math.random() * 9999);
    var timer = setTimeout(function() { cleanup(); reject(new Error("Timed out")); }, 15000);
    function cleanup() {
      delete window[cb];
      var s = document.getElementById(cb);
      if (s) s.remove();
      clearTimeout(timer);
    }
    window[cb] = function(data) { cleanup(); resolve(data); };
    var qs = new URLSearchParams(params);
    qs.set("callback", cb);
    var s = document.createElement("script");
    s.id = cb;
    s.src = SCRIPT_URL + "?" + qs.toString();
    s.onerror = function() { cleanup(); reject(new Error("Network error")); };
    document.body.appendChild(s);
  });
}

var toastTimer;
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.style.display = "none"; }, 2500);
}

function switchTab(tab) {
  curTab = tab;
  ["lb","ac","ad"].forEach(function(t) {
    document.getElementById(t).style.display = t === tab ? "" : "none";
  });
  document.querySelectorAll(".tab").forEach(function(el, i) {
    el.classList.toggle("on", ["lb","ac","ad"][i] === tab);
  });
  if (tab !== "ad") loadData();
  else renderAdmin();
}

function loadData() {
  document.getElementById(curTab).innerHTML = '<div class="spin">Loading&#8230;</div>';
  api({ action: "getAll" }).then(function(data) {
    members = data.members || [];
    activity = (data.activity || []).slice().reverse();
    if (curTab === "lb") renderLB();
    else if (curTab === "ac") renderAC();
    else renderAdmin();
  }).catch(function(e) {
    showToast("Could not load data: " + e.message);
  });
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function empty(msg) {
  return '<div class="empty"><div style="font-size:32px;margin-bottom:8px">&#x1F634;</div>' + msg + '</div>';
}

function renderLB() {
  var sorted = members.slice().sort(function(a,b){ return parseInt(b.coins) - parseInt(a.coins); });
  var el = document.getElementById("lb");
  if (!sorted.length) { el.innerHTML = empty("No team members yet."); return; }
  var medals = ["&#x1F947;","&#x1F948;","&#x1F949;"];
  el.innerHTML = sorted.map(function(m, i) {
    return '<div class="li' + (i===0?' top':'') + '">' +
      '<div class="rank">' + (i < 3 ? medals[i] : (i+1)+".") + '</div>' +
      '<div class="lname">' + esc(m.name) + '</div>' +
      '<div class="lcoins">' + m.coins + ' &#x1FA99;</div>' +
      '</div>';
  }).join("");
}

function renderAC() {
  var el = document.getElementById("ac");
  if (!activity.length) { el.innerHTML = empty("No activity yet."); return; }
  el.innerHTML = activity.map(function(a) {
    var amt = parseInt(a.amount);
    return '<div class="ai">' +
      '<div class="arow">' +
      '<span class="aname">' + esc(a.name) + '</span>' +
      '<span class="aamt ' + (amt < 0 ? 'neg' : 'pos') + '">' + (amt > 0 ? '+' : '') + amt + ' &#x1FA99;</span>' +
      '</div>' +
      (a.reason ? '<div class="ars">&ldquo;' + esc(a.reason) + '&rdquo;</div>' : '') +
      '<div class="ats">' + esc(String(a.ts)) + '</div>' +
      '</div>';
  }).join("");
}

function renderAdmin() {
  var el = document.getElementById("ad");
  if (!isAdmin) {
    el.innerHTML = '<div class="card" style="text-align:center">' +
      '<div style="font-size:32px;margin-bottom:8px">&#x1F512;</div>' +
      '<p style="color:#555;margin-bottom:16px;font-size:14px">Enter the admin password to continue.</p>' +
      '<input type="password" id="pw" placeholder="Password" style="margin-bottom:8px" />' +
      '<div id="pwerr" class="errt">Incorrect password. Try again.</div>' +
      '<button class="btn" onclick="doLogin()">Unlock</button>' +
      '</div>';
    document.getElementById("pw").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });
    return;
  }
  var mlist = members.length === 0
    ? '<div style="color:#aaa;font-size:13px;text-align:center;padding:8px 0">No members yet.</div>'
    : members.map(function(m) {
        return '<div class="mr">' +
          '<span class="mn">' + esc(m.name) + '</span>' +
          '<span class="mc">' + m.coins + ' &#x1FA99;</span>' +
          '<button class="btn ico" onclick="removeMember(\'' + m.id + '\',\'' + esc(m.name) + '\')">&#x2715;</button>' +
          '</div>';
      }).join("");
  var opts = members.map(function(m) {
    return '<option value="' + m.id + '">' + esc(m.name) + '</option>';
  }).join("");

  el.innerHTML = '<div class="ahdr">' +
    '<span style="font-weight:700;color:#1a1a2e">Admin Panel</span>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn out sm" onclick="loadData()">&#x21BB; Refresh</button>' +
    '<button class="btn out sm" onclick="doLock()">Lock</button>' +
    '</div></div>' +

    '<div class="card">' +
    '<div class="ctitle">&#x1FA99; Award / Remove Coins</div>' +
    '<select id="ato"><option value="">Select team member&hellip;</option>' + opts + '</select>' +
    '<div class="row">' +
    '<input type="number" id="aamt" value="1" min="1" style="width:80px" />' +
    '<input id="ars" placeholder="Reason (optional)" style="flex:1" />' +
    '</div>' +
    '<div class="row mt10">' +
    '<button class="btn" style="flex:1" onclick="adjustCoins(false)">&#x2795; Award</button>' +
    '<button class="btn red" style="flex:1" onclick="adjustCoins(true)">&#x2796; Remove</button>' +
    '</div>' +
    '<div id="sav" class="sav">Saving&hellip;</div>' +
    '</div>' +

    '<div class="card">' +
    '<div class="ctitle">&#x1F465; Manage Members</div>' +
    '<div class="row" style="margin-top:0">' +
    '<input id="nm" placeholder="New member name&hellip;" style="flex:1" />' +
    '<button class="btn" style="width:auto;padding:0 18px" onclick="addMember()">Add</button>' +
    '</div>' +
    '<div style="margin-top:12px">' + mlist + '</div>' +
    '</div>' +

    '<div class="card">' +
    '<div class="ctitle">&#x1F504; Reset</div>' +
    '<p class="desc">Reset every team member\'s coin balance to zero.</p>' +
    '<div id="rc"><button class="btn red" onclick="confirmBtn(\'rc\',\'Yes, reset all coins\',doResetCoins)">Reset All Coins to Zero</button></div>' +
    '<p class="desc mt16">Permanently erase all activity history.</p>' +
    '<div id="ca"><button class="btn gray" onclick="confirmBtn(\'ca\',\'Yes, clear history\',doClearActivity)">Clear Activity History</button></div>' +
    '</div>';

  document.getElementById("nm").addEventListener("keydown", function(e) {
    if (e.key === "Enter") addMember();
  });
}

function confirmBtn(id, label, fn) {
  document.getElementById(id).innerHTML =
    '<div class="crow">' +
    '<button class="btn red" style="flex:1" onclick="(' + fn.toString() + ')()">' + label + '</button>' +
    '<button class="btn gray" style="flex:1" onclick="renderAdmin()">Cancel</button>' +
    '</div>';
}

function doLogin() {
  var pw = document.getElementById("pw").value;
  if (pw === PASS) { isAdmin = true; loadData(); }
  else { document.getElementById("pwerr").style.display = "block"; }
}

function doLock() { isAdmin = false; renderAdmin(); }

function run(fn, msg) {
  if (working) return;
  working = true;
  var s = document.getElementById("sav");
  if (s) s.style.display = "block";
  fn().then(function() {
    return loadData();
  }).then(function() {
    if (msg) showToast(msg);
    working = false;
    var s2 = document.getElementById("sav");
    if (s2) s2.style.display = "none";
  }).catch(function(e) {
    showToast("Error: " + e.message);
    working = false;
    var s2 = document.getElementById("sav");
    if (s2) s2.style.display = "none";
  });
}

function addMember() {
  var name = document.getElementById("nm").value.trim();
  if (!name) return;
  if (members.find(function(m){ return m.name.toLowerCase() === name.toLowerCase(); })) {
    showToast("Member already exists!"); return;
  }
  run(function() { return api({ action: "addMember", name: name }); }, "Added " + name + "!");
}

function removeMember(id, name) {
  run(function() { return api({ action: "removeMember", id: id }); }, "Removed " + name);
}

function adjustCoins(remove) {
  var aTo = document.getElementById("ato").value;
  var aAmt = parseInt(document.getElementById("aamt").value);
  var aRs = document.getElementById("ars").value.trim();
  if (!aTo || aAmt < 1) return;
  var rec = members.find(function(m){ return String(m.id) === String(aTo); });
  var actual = remove ? Math.min(aAmt, parseInt(rec.coins)) : aAmt;
  var final = remove ? -actual : actual;
  var msg = remove
    ? "Removed " + actual + " coin" + (actual !== 1 ? "s" : "") + " from " + rec.name
    : "Awarded " + aAmt + " coin" + (aAmt !== 1 ? "s" : "") + " to " + rec.name + "!";
  run(function() {
    return api({ action: "adjustCoins", id: rec.id, name: rec.name, amount: final, reason: aRs, ts: new Date().toLocaleString() });
  }, msg);
}

function doResetCoins() {
  run(function() { return api({ action: "resetCoins" }); }, "All coins reset to zero!");
}

function doClearActivity() {
  run(function() { return api({ action: "clearActivity" }); }, "Activity history cleared!");
}

loadData();
</script>
</body>
</html>
